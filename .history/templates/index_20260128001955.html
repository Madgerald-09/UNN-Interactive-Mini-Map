<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNN Interactive Mini-Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="logo">
                <h1><i class="fas fa-university"></i> UNN Map</h1>
                <p>University of Nigeria, Nsukka</p>
            </div>
            
            <!-- Search Box -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search locations...">
                    <button id="searchBtn">Go</button>
                </div>
                <div id="searchResults"></div>
            </div>
            
            <!-- Location Categories -->
            <div class="categories">
                <h3><i class="fas fa-filter"></i> Filter by Type</h3>
                <div class="category-buttons">
                    <button class="category-btn active" data-type="all">All</button>
                    <button class="category-btn" data-type="academic">Academic</button>
                    <button class="category-btn" data-type="administrative">Admin</button>
                    <button class="category-btn" data-type="residential">Hostels</button>
                    <button class="category-btn" data-type="health">Health</button>
                </div>
            </div>
            
            <!-- Selected Location Info -->
            <div class="location-info" id="locationInfo">
                <h3><i class="fas fa-info-circle"></i> Location Details</h3>
                <p>Click on any marker to see details</p>
            </div>
            
            <!-- Directions Panel -->
            <div class="directions-panel">
                <h3><i class="fas fa-directions"></i> Directions</h3>
                <div class="direction-inputs">
                    <input type="text" id="fromInput" placeholder="From...">
                    <input type="text" id="toInput" placeholder="To...">
                    <button id="getDirectionsBtn">Get Directions</button>
                </div>
                <div id="directionsResult"></div>
            </div>
        </div>
        
        <!-- Main Map -->
        <div class="map-container">
            <div id="map"></div>
            
            <!-- Map Controls -->
            <div class="map-controls">
                <button id="locateBtn" title="Locate Me">
                    <i class="fas fa-location-crosshairs"></i>
                </button>
                <button id="zoomInBtn" title="Zoom In">
                    <i class="fas fa-plus"></i>
                </button>
                <button id="zoomOutBtn" title="Zoom Out">
                    <i class="fas fa-minus"></i>
                </button>
                <button id="fullscreenBtn" title="Fullscreen">
                    <i class="fas fa-expand"></i>
                </button>
            </div>
            
            <!-- Layer Control -->
            <div class="layer-control">
                <h4><i class="fas fa-layer-group"></i> Map Layers</h4>
                <div class="layer-options">
                    <label>
                        <input type="radio" name="layer" value="osm" checked> Street Map
                    </label>
                    <label>
                        <input type="radio" name="layer" value="satellite"> Satellite
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
